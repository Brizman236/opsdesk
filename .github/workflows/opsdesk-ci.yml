name: OpsDesk CI Pipeline

on: 
    pull_request: 
        branches: ['main']
    push: 
      branches: ['main']
    
    workflow_dispatch: 

jobs:
    validate:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout the code
              uses: actions/checkout@v6
        
            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                node-version: 24
            
            - name: Install Dependencies
              run: npm ci --omit=dev
            
            - name: Check code synthax
              run: find ./src -name "*.js" -print0 | xargs -0 -n 1 node --check
    test:
        runs-on: ubuntu-latest
        needs: validate
        services:
          postgres:
            image: postgres:17.6-alpine
            env:
              POSTGRES_DB: ${{ vars.DB_TEST }}
              POSTGRES_USER: ${{ vars.DB_TEST_USERNAME }}
              POSTGRES_PASSWORD: ${{ secrets.DB_TEST_PASSWORD }}
            ports:
              - 5432:5432
            options: >-
              --health-cmd pg_isready
              --health-interval 10s
              --health-timeout 5s
              --health-retries 5
        env:
          TEST_DATABASE_URL: "postgresql://${{ vars.DB_TEST_USERNAME}}:${{secrets.DB_TEST_PASSWORD}}@localhost:5432/${{ vars.DB_TEST }}"
          NODE_ENV: "test"
        steps:
          - name: Checkout the code
            uses: actions/checkout@v6
        
          - name: Setup Node.js
            uses: actions/setup-node@v7
            with:
              node-version: 24
          
          - name: Install Dependencies
            run: npm ci
          
          - name: Migrate data in test database
            run: |
              npm run db:generate
              npm run db:migrate
          
          - name: Run integration tests for /api/tickets endpoint
            run: npm test
